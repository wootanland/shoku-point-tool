<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喰ポイント管理ツール</title>
<style>
  :root {
    --art-color: #7c3aed;
    --rb-color: #2979ff;
    --orange: #f5820d;
    --bg: #f5f6fa;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #222;
    --muted: #777;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background:var(--bg); color:var(--text); }
  header { background:#1a1a2e; color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .btns { display:flex; gap:8px; }
  header button { border:none; border-radius:6px; padding:8px 12px; font-size:13px; }
  #refreshBtn { background:#2563eb; color:#fff; }
  #resetBtn { background:#c0392b; color:#fff; }
  .hall-tabs { display:flex; gap:6px; padding:8px; overflow-x:auto; background:#fff; border-bottom:1px solid var(--border); position:sticky; top:56px; z-index:9; }
  .hall-tabs button { flex-shrink:0; border:1px solid var(--border); background:#eee; border-radius:14px; padding:6px 12px; font-size:12px; white-space:nowrap; }
  .hall-tabs button.active { background:#333; color:#fff; border-color:#333; }
  .hall-delete-btn { margin-left:6px; color:#c0392b; font-weight:bold; padding:0 2px; }
  .hall-tabs button.active .hall-delete-btn { color:#ff9d9d; }
  .row-delete-btn { background:none; border:none; font-size:18px; padding:4px 8px; cursor:pointer; color:#c0392b; font-weight:bold; line-height:1; }
  .confirm-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; z-index:2000; padding:20px; }
  .confirm-overlay.show { display:flex; }
  .confirm-box { background:#fff; border-radius:12px; max-width:320px; width:100%; padding:20px; text-align:center; }
  .confirm-msg { font-size:14px; margin-bottom:16px; white-space:pre-line; }
  .confirm-actions { display:flex; gap:10px; }
  .confirm-actions button { flex:1; border:none; border-radius:8px; padding:10px; font-size:14px; }
  .confirm-cancel-btn { background:#eee; color:#333; }
  .confirm-ok-btn { background:#c0392b; color:#fff; }
  table.list { width:100%; border-collapse:collapse; background:#fff; }
  table.list th, table.list td { padding:10px 8px; text-align:center; border-bottom:1px solid var(--border); font-size:14px; }
  table.list th { background:#333; color:#fff; font-size:12px; }
  table.list tbody tr:active { background:#f0f0f0; }
  .daiban-link { color:#1a56db; font-weight:bold; text-decoration:underline; }
  .daiban-cell .hall-sub { font-size:10px; color:var(--muted); margin-top:2px; }
  .nerai-cell { font-size:12px; white-space:nowrap; }
  .nerai-cell.has-target { color:#c0392b; font-weight:bold; }
  .nerai-cell.no-target { color:var(--muted); }
  .nerai-cell.unknown { color:#bbb; }
  .empty, .loading { padding:40px; text-align:center; color:var(--muted); }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:16px; z-index:1000; }
  .modal-overlay.show { display:flex; }
  .modal { background:#fff; border-radius:10px; max-width:520px; width:100%; overflow:hidden; margin-top:20px; }
  .modal-header { background:var(--orange); color:#fff; padding:14px; font-weight:bold; text-align:center; }
  .modal-sub { padding:10px 14px; font-size:13px; color:#333; border-bottom:1px solid var(--border); }
  .modal-close { text-align:right; padding:8px 12px; background:#fff; }
  .modal-close button { background:#333; color:#fff; border:none; border-radius:6px; padding:6px 12px; }
  .pt-summary { display:flex; gap:10px; padding:12px 14px; flex-wrap:wrap; }
  .pt-summary .box { flex:1; min-width:90px; background:#f5f6fa; border-radius:8px; padding:8px; text-align:center; }
  .pt-summary .box .label { font-size:11px; color:var(--muted); }
  .pt-summary .box .val { font-size:18px; font-weight:bold; }
  .pt-summary .box .val.small { font-size:13px; }
  table.detail { width:100%; border-collapse:collapse; }
  table.detail th, table.detail td { padding:6px 4px; text-align:center; border-bottom:1px solid var(--border); font-size:12px; }
  table.detail th { background:#eee; position:sticky; top:0; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; color:#fff; font-weight:bold; font-size:12px; }
  .badge.art { background:var(--art-color); }
  .badge.rb { background:var(--rb-color); }
  .detail-scroll { max-height:60vh; overflow-y:auto; }
</style>
</head>
<body>
<header>
  <h1>喰ポイント管理ツール</h1>
  <div class="btns">
    <button id="refreshBtn">更新</button>
    <button id="resetBtn">リセット</button>
  </div>
</header>
<div id="hallTabs" class="hall-tabs" style="display:none;"></div>
<div id="listWrap">
  <div id="loadingMsg" class="loading">読み込み中...</div>
  <table class="list" id="listTable" style="display:none;">
    <thead><tr><th>台番</th><th>喰pt</th><th>狙い目</th><th>最終更新</th><th></th></tr></thead>
    <tbody id="listBody"></tbody>
  </table>
  <div id="emptyMsg" class="empty" style="display:none;">まだデータがありません。<br>サイトセブンの大当り履歴ページでブックマークレットを実行してください。</div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-actions">
      <button class="confirm-cancel-btn" id="confirmCancelBtn">キャンセル</button>
      <button class="confirm-ok-btn" id="confirmOkBtn">削除</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-close"><button id="closeBtn">閉じる</button></div>
    <div class="modal-header" id="modalTitle"></div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="pt-summary" id="modalSummary"></div>
    <div class="detail-scroll">
      <table class="detail" id="modalTable"></table>
    </div>
  </div>
</div>

<script>
// 狙い目の表示（サーバー側(Apps Script)で計算済みのneraiTextをそのまま表示する）
function getNeraiCell(entry){
  const t = entry.neraiText;
  if (t === undefined || t === null) return { text: '未計算', cls: 'unknown' };
  if (t === '判定不可') return { text: t, cls: 'unknown' };
  if (t === '-') return { text: t, cls: 'no-target' };
  return { text: t, cls: 'has-target' };
}

// 独自の確認ダイアログ（ブラウザ標準confirm()の代わり）
function showConfirm(message, onConfirm){
  const overlay = document.getElementById('confirmOverlay');
  document.getElementById('confirmMsg').textContent = message;
  overlay.classList.add('show');
  const okBtn = document.getElementById('confirmOkBtn');
  const cancelBtn = document.getElementById('confirmCancelBtn');
  function cleanup(){
    overlay.classList.remove('show');
    okBtn.removeEventListener('click', onOk);
    cancelBtn.removeEventListener('click', onCancel);
  }
  function onOk(){ cleanup(); onConfirm(); }
  function onCancel(){ cleanup(); }
  okBtn.addEventListener('click', onOk);
  cancelBtn.addEventListener('click', onCancel);
}

// ▼▼▼ ここにApps ScriptのウェブアプリURLを入れてください ▼▼▼
const API_URL = 'https://script.google.com/macros/s/AKfycbyLPgRPkHY932M2JleXKsKJ5TZKdOMBUJuOh6AwyvXTd4AssaA--zBxvr4sc_QjBNd1/exec';
// ▲▲▲ ここにApps ScriptのウェブアプリURLを入れてください ▲▲▲

function jsonp(url, params, callback){
  const cbName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
  const script = document.createElement('script');
  let done = false;
  window[cbName] = function(data){
    if(done) return;
    done = true;
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
    callback(null, data);
  };
  script.onerror = function(){
    if(done) return;
    done = true;
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
    callback(new Error('load failed'));
  };
  const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
  script.src = url + '?' + qs + '&callback=' + cbName;
  document.body.appendChild(script);
  setTimeout(function(){
    if(!done){ done = true; delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); callback(new Error('timeout')); }
  }, 10000);
}

// まずfetchで試し、失敗したらJSONPにフォールバックする
function callApi(url, params, callback){
  const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
  fetch(url + '?' + qs, { method: 'GET' })
    .then(function(r){
      if(!r.ok) throw new Error('http ' + r.status);
      return r.json();
    })
    .then(function(data){ callback(null, data); })
    .catch(function(fetchErr){
      jsonp(url, params, function(jsonpErr, data){
        if(jsonpErr){
          callback(new Error('fetch失敗(' + fetchErr.message + ') / JSONPも失敗(' + jsonpErr.message + ')'));
        } else {
          callback(null, data);
        }
      });
    });
}

let entries = [];
let selectedHall = null; // null = すべて

function fetchList(){
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('listTable').style.display = 'none';
  document.getElementById('emptyMsg').style.display = 'none';
  callApi(API_URL, {action:'list'}, function(err, data){
    document.getElementById('loadingMsg').style.display = 'none';
    if(err){
      document.getElementById('emptyMsg').style.display = 'block';
      document.getElementById('emptyMsg').textContent = '読み込みに失敗しました: ' + err.message;
      return;
    }
    entries = Array.isArray(data) ? data : [];
    renderTabs();
    render();
  });
}

function renderTabs(){
  let halls = [];
  entries.forEach(e => { if(e.hallName && halls.indexOf(e.hallName) === -1) halls.push(e.hallName); });
  const tabsEl = document.getElementById('hallTabs');
  tabsEl.innerHTML = '';
  if(halls.length === 0){
    tabsEl.style.display = 'none';
    return;
  }
  tabsEl.style.display = 'flex';
  if(selectedHall && halls.indexOf(selectedHall) === -1) selectedHall = null;

  const allBtn = document.createElement('button');
  allBtn.textContent = 'すべて';
  if(!selectedHall) allBtn.classList.add('active');
  allBtn.addEventListener('click', () => { selectedHall = null; renderTabs(); render(); });
  tabsEl.appendChild(allBtn);

  halls.forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'hall-tab-btn';
    btn.innerHTML = '<span>'+h+'</span><span class="hall-delete-btn" title="このホールの台を全削除">×</span>';
    if(selectedHall === h) btn.classList.add('active');
    btn.querySelector('span:first-child').addEventListener('click', () => { selectedHall = h; renderTabs(); render(); });
    btn.querySelector('.hall-delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      showConfirm('「'+h+'」の登録台を全て削除します。よろしいですか？', () => {
        callApi(API_URL, {action:'deleteHall', hallName: h}, function(err){
          if(err){ alert('削除に失敗しました: ' + err.message); return; }
          entries = entries.filter(e => e.hallName !== h);
          if(selectedHall === h) selectedHall = null;
          renderTabs();
          render();
        });
      });
    });
    tabsEl.appendChild(btn);
  });
}

function render(){
  const listBody = document.getElementById('listBody');
  const emptyMsg = document.getElementById('emptyMsg');
  const listTable = document.getElementById('listTable');
  listBody.innerHTML = '';

  const filtered = entries.filter(e => !selectedHall || e.hallName === selectedHall);

  if(filtered.length === 0){
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = entries.length === 0
      ? 'まだデータがありません。サイトセブンの大当り履歴ページでブックマークレットを実行してください。'
      : 'このホールのデータはまだありません。';
    listTable.style.display = 'none';
    return;
  }
  emptyMsg.style.display = 'none';
  listTable.style.display = 'table';

  const sorted = filtered.slice().sort((a,b) => (parseInt(a.daiban,10)||0) - (parseInt(b.daiban,10)||0));

  sorted.forEach(entry => {
    const tr = document.createElement('tr');
    const dt = entry.updatedAt ? new Date(entry.updatedAt) : null;
    const dtStr = dt ? (dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0') : '-';
    const nerai = getNeraiCell(entry);
    tr.innerHTML = '<td class="daiban-cell"><span class="daiban-link">'+(entry.daiban||'-')+'</span><div class="hall-sub">'+(entry.hallName||'-')+'</div></td>'+
      '<td>'+(entry.currentPT!=null?entry.currentPT:'-')+'pt</td>'+
      '<td class="nerai-cell '+nerai.cls+'">'+nerai.text+'</td>'+
      '<td>'+dtStr+'</td>'+
      '<td><button class="row-delete-btn" title="この台を削除">×</button></td>';
    tr.addEventListener('click', () => openDetail(entry));
    tr.querySelector('.row-delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      showConfirm(entry.daiban+'番台のデータを削除します。よろしいですか？', () => {
        callApi(API_URL, {action:'deleteOne', hallName: entry.hallName||'', daiban: entry.daiban||''}, function(err){
          if(err){ alert('削除に失敗しました: ' + err.message); return; }
          entries = entries.filter(e => !(e.hallName === entry.hallName && e.daiban === entry.daiban));
          renderTabs();
          render();
        });
      });
    });
    listBody.appendChild(tr);
  });
}

function openDetail(entry){
  document.getElementById('modalTitle').textContent = (entry.modelName||'') + '｜' + entry.daiban + '番台';
  document.getElementById('modalSub').textContent = (entry.hallName||'');

  const nerai = getNeraiCell(entry);
  const summary = document.getElementById('modalSummary');
  summary.innerHTML =
    '<div class="box"><div class="label">現在の喰pt</div><div class="val">'+entry.currentPT+'pt</div></div>'+
    '<div class="box"><div class="label">現在経過ゲーム</div><div class="val">'+entry.currentElapsed+'G</div></div>'+
    '<div class="box"><div class="label">狙い目</div><div class="val small">'+nerai.text+'</div></div>';

  const table = document.getElementById('modalTable');
  table.innerHTML = '<tbody><tr><td style="padding:24px;color:#777;">読み込み中...</td></tr></tbody>';

  document.getElementById('modalOverlay').classList.add('show');

  // 大当り履歴の詳細(rows)は一覧には含まれていないため、開いた時だけ個別取得する
  callApi(API_URL, {action:'detail', hallName: entry.hallName||'', daiban: entry.daiban||''}, function(err, detail){
    if(err || !detail){
      table.innerHTML = '<tbody><tr><td style="padding:24px;color:#c0392b;">履歴の読み込みに失敗しました</td></tr></tbody>';
      return;
    }
    let html = '<thead><tr><th>回数</th><th>種類</th><th>G</th><th>獲得</th><th>PT</th><th>累計</th><th>差枚</th></tr></thead><tbody>';
    (detail.rows||[]).forEach(r => {
      const badgeClass = r.kind === 'ART' ? 'art' : 'rb';
      html += '<tr><td>'+(r.cnt||'-')+'</td><td><span class="badge '+badgeClass+'">'+r.kind+'</span></td>'+
        '<td>'+r.game+'G</td><td>'+(r.getRaw||'-')+'枚</td><td>'+r.E+'</td><td>'+r.F+'</td><td>'+(r.ZD!=null?r.ZD:'-')+'</td></tr>';
    });
    html += '</tbody>';
    table.innerHTML = html;
  });
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('show');
});
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'modalOverlay') document.getElementById('modalOverlay').classList.remove('show');
});

document.getElementById('refreshBtn').addEventListener('click', fetchList);

document.getElementById('resetBtn').addEventListener('click', () => {
  showConfirm('サーバー上の全データを削除します。よろしいですか？', () => {
    callApi(API_URL, {action:'reset'}, function(err){
      if(err){ alert('削除に失敗しました: ' + err.message); return; }
      fetchList();
    });
  });
});

fetchList();
</script>
</body>
</html>
