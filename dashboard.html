<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台データダッシュボード</title>
<style>
  :root {
    --bg: #f5f6fa;
    --border: #e0e0e0;
    --text: #222;
    --muted: #777;
    --good: #d1fae5;
    --good-border: #10b981;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background:var(--bg); color:var(--text); }
  header { background:#1a1a2e; color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .btns { display:flex; gap:8px; }
  header button { border:none; border-radius:6px; padding:8px 12px; font-size:13px; }
  #refreshBtn { background:#2563eb; color:#fff; }
  #resetBtn { background:#c0392b; color:#fff; }
  .toolbar { display:flex; gap:8px; padding:10px 16px; flex-wrap:wrap; align-items:center; background:#fff; border-bottom:1px solid var(--border); }
  .toolbar button { background:#eee; border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:12px; }
  .toolbar button.active { background:#333; color:#fff; }
  .threshold-box { display:flex; align-items:center; gap:6px; font-size:12px; margin-left:auto; }
  .threshold-box input { width:70px; padding:4px 6px; border:1px solid var(--border); border-radius:6px; }
  table.list { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
  table.list th, table.list td { padding:8px 6px; text-align:center; border-bottom:1px solid var(--border); }
  table.list th { background:#333; color:#fff; font-size:11px; position:sticky; top:0; }
  table.list tbody tr:active { background:#f0f0f0; }
  table.list tbody tr.hit { background:var(--good); border-left:4px solid var(--good-border); }
  .daiban-link { color:#1a56db; font-weight:bold; text-decoration:underline; }
  .empty, .loading { padding:40px; text-align:center; color:var(--muted); }
  .model-name { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>台データダッシュボード</h1>
  <div class="btns">
    <button id="refreshBtn">更新</button>
    <button id="resetBtn">リセット</button>
  </div>
</header>
<div class="toolbar">
  <button data-sort="daiban" class="active">台番順</button>
  <button data-sort="hall">ホールごと</button>
  <button data-sort="prob">合成確率順</button>
  <button data-sort="updated">最終更新順</button>
  <div class="threshold-box">
    合成確率が 1/<input type="number" id="thresholdInput" placeholder="150"> 以下をハイライト
  </div>
</div>
<div id="listWrap">
  <div id="loadingMsg" class="loading">読み込み中...</div>
  <table class="list" id="listTable" style="display:none;">
    <thead><tr><th>台番</th><th>ホール</th><th>合成確率</th><th>最高出玉</th><th>累計ゲーム</th><th>最終更新</th></tr></thead>
    <tbody id="listBody"></tbody>
  </table>
  <div id="emptyMsg" class="empty" style="display:none;">まだデータがありません。<br>サイトセブンの出玉詳細ページでブックマークレットを実行してください。</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyLPgRPkHY932M2JleXKsKJ5TZKdOMBUJuOh6AwyvXTd4AssaA--zBxvr4sc_QjBNd1/exec';

function jsonp(url, params, callback){
  const cbName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
  const script = document.createElement('script');
  let done = false;
  window[cbName] = function(data){
    if(done) return;
    done = true;
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
    callback(null, data);
  };
  script.onerror = function(){
    if(done) return;
    done = true;
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
    callback(new Error('load failed'));
  };
  const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
  script.src = url + '?' + qs + '&callback=' + cbName;
  document.body.appendChild(script);
  setTimeout(function(){
    if(!done){ done = true; delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); callback(new Error('timeout')); }
  }, 10000);
}

function callApi(url, params, callback){
  const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
  fetch(url + '?' + qs, { method: 'GET' })
    .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(data){ callback(null, data); })
    .catch(function(fetchErr){
      jsonp(url, params, function(jsonpErr, data){
        if(jsonpErr){ callback(new Error('通信失敗')); }
        else { callback(null, data); }
      });
    });
}

let entries = [];
let currentSort = 'daiban';
let sortDir = 1;

function parseProbDenom(text){
  if(!text) return null;
  const m = String(text).match(/1\/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

function fetchList(){
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('listTable').style.display = 'none';
  document.getElementById('emptyMsg').style.display = 'none';
  callApi(API_URL, {action:'listDai'}, function(err, data){
    document.getElementById('loadingMsg').style.display = 'none';
    if(err){
      document.getElementById('emptyMsg').style.display = 'block';
      document.getElementById('emptyMsg').textContent = '読み込みに失敗しました: ' + err.message;
      return;
    }
    entries = Array.isArray(data) ? data : [];
    render();
  });
}

function render(){
  const listBody = document.getElementById('listBody');
  const emptyMsg = document.getElementById('emptyMsg');
  const listTable = document.getElementById('listTable');
  listBody.innerHTML = '';

  if(entries.length === 0){
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = 'まだデータがありません。サイトセブンの出玉詳細ページでブックマークレットを実行してください。';
    listTable.style.display = 'none';
    return;
  }
  emptyMsg.style.display = 'none';
  listTable.style.display = 'table';

  const threshold = parseInt(document.getElementById('thresholdInput').value, 10) || null;

  const sorted = entries.slice().sort((a,b) => {
    if(currentSort === 'daiban'){
      return (parseInt(a.daiban,10)||0) - (parseInt(b.daiban,10)||0);
    } else if(currentSort === 'hall'){
      const h = (a.hallName||'').localeCompare(b.hallName||'');
      if(h !== 0) return h;
      return (parseInt(a.daiban,10)||0) - (parseInt(b.daiban,10)||0);
    } else if(currentSort === 'prob'){
      const pa = parseProbDenom(a.total_prob) || 999999;
      const pb = parseProbDenom(b.total_prob) || 999999;
      return pa - pb;
    } else if(currentSort === 'updated'){
      return sortDir * (new Date(a.updatedAt||0) - new Date(b.updatedAt||0));
    }
    return 0;
  });

  sorted.forEach(entry => {
    const tr = document.createElement('tr');
    const denom = parseProbDenom(entry.total_prob);
    if(threshold && denom && denom <= threshold){
      tr.classList.add('hit');
    }
    const dt = entry.updatedAt ? new Date(entry.updatedAt) : null;
    const dtStr = dt ? (dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0') : '-';
    tr.innerHTML =
      '<td><span class="daiban-link">'+(entry.daibanDisplay||entry.daiban||'-')+'</span><div class="model-name">'+(entry.modelName||'')+'</div></td>'+
      '<td>'+(entry.hallName||'-')+'</td>'+
      '<td>'+(entry.total_prob||'-')+'</td>'+
      '<td>'+(entry.dedamax||'-')+'枚</td>'+
      '<td>'+(entry.game_total||'-')+'</td>'+
      '<td>'+dtStr+'</td>';
    tr.addEventListener('click', () => {
      if(entry.siteUrl) window.open(entry.siteUrl, '_blank');
    });
    listBody.appendChild(tr);
  });
}

document.getElementById('refreshBtn').addEventListener('click', fetchList);
document.getElementById('thresholdInput').addEventListener('input', render);

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('台データをすべて削除します。よろしいですか？')){
    callApi(API_URL, {action:'resetDai'}, function(err){
      if(err){ alert('削除に失敗しました: ' + err.message); return; }
      fetchList();
    });
  }
});

document.querySelectorAll('.toolbar button[data-sort]').forEach(btn => {
  btn.addEventListener('click', () => {
    const sortKey = btn.dataset.sort;
    if(currentSort === sortKey && sortKey === 'updated'){
      sortDir = -sortDir;
    } else {
      sortDir = 1;
    }
    currentSort = sortKey;
    document.querySelectorAll('.toolbar button[data-sort]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

fetchList();
</script>
</body>
</html>
