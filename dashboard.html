<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイトセブン ショートカット</title>
<style>
  :root {
    --bg: #f5f6fa;
    --border: #e0e0e0;
    --text: #222;
    --muted: #777;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background:var(--bg); color:var(--text); }
  header { background:#1a1a2e; color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .btns { display:flex; gap:8px; }
  header button { border:none; border-radius:6px; padding:8px 12px; font-size:13px; }
  #refreshBtn { background:#2563eb; color:#fff; }
  #resetBtn { background:#c0392b; color:#fff; }
  #reorderBtn { background:#7c3aed; color:#fff; }
  .empty, .loading { padding:40px; text-align:center; color:var(--muted); }
  .hall-tabs { display:flex; gap:6px; padding:8px; overflow-x:auto; background:#fff; border-bottom:1px solid var(--border); position:sticky; top:56px; z-index:9; align-items:center; }
  .hall-tabs .tab-wrap { display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .hall-tabs button.hall-btn { flex-shrink:0; border:1px solid var(--border); background:#eee; border-radius:14px; padding:6px 12px; font-size:12px; white-space:nowrap; }
  .hall-tabs button.hall-btn.active { background:#333; color:#fff; border-color:#333; }
  .move-btn { flex-shrink:0; border:none; background:#ddd; border-radius:6px; width:22px; height:22px; font-size:11px; line-height:1; }
  .card-list { padding:6px; display:flex; flex-direction:column; gap:5px; }
  .group { background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .group-head { display:flex; align-items:center; gap:6px; padding:6px 8px; cursor:pointer; }
  .group-head .model { font-weight:bold; font-size:13px; color:#1a56db; text-decoration:underline; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .group-head .hall { font-size:10px; color:var(--muted); }
  .group-head .toggle { font-size:16px; font-weight:bold; color:var(--muted); width:20px; text-align:center; flex-shrink:0; }
  .group-suii { background:#f5820d; color:#fff; border:none; border-radius:6px; padding:4px 8px; font-size:11px; flex-shrink:0; }
  .group-del { background:none; border:none; color:#c0392b; font-size:16px; font-weight:bold; flex-shrink:0; padding:2px 6px; }
  .group-move { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .group-move button { border:none; background:#ddd; border-radius:4px; width:20px; height:16px; font-size:9px; line-height:1; }
  .group-body { border-top:1px solid var(--border); }
  .group-body.collapsed { display:none; }
  .dai-row { display:flex; align-items:center; gap:6px; padding:5px 8px; border-bottom:1px dotted var(--border); }
  .dai-row:last-child { border-bottom:none; }
  .dai-row .dn { font-size:12px; font-weight:bold; width:36px; flex-shrink:0; }
  .dai-row .links { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; flex:1; }
  .dai-row .links button { display:block; width:100%; text-align:center; padding:5px 2px; border-radius:6px; font-size:11px; border:none; color:#fff; font-family:inherit; }
  .dai-del { background:none; border:none; color:#c0392b; font-size:14px; font-weight:bold; flex-shrink:0; padding:2px 4px; }
  .lnk-detail { background:#7c3aed; }
  .lnk-history { background:#2979ff; }
  .lnk-suii { background:#f5820d; }
  .lnk-list { background:#16a34a; }
</style>
</head>
<body>
<header>
  <h1>サイトセブン ショートカット</h1>
  <div class="btns">
    <button id="reorderBtn">並び替え</button>
    <button id="refreshBtn">更新</button>
    <button id="resetBtn">リセット</button>
  </div>
</header>
<div id="wrap">
  <div id="hallTabs" class="hall-tabs" style="display:none;"></div>
  <div id="loadingMsg" class="loading">読み込み中...</div>
  <div id="cardList" class="card-list" style="display:none;"></div>
  <div id="emptyMsg" class="empty" style="display:none;">まだデータがありません。<br>サイトセブンの出玉詳細ページでブックマークレットを実行してください。</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyLPgRPkHY932M2JleXKsKJ5TZKdOMBUJuOh6AwyvXTd4AssaA--zBxvr4sc_QjBNd1/exec';

function jsonp(url, params, callback){
  const cbName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
  const script = document.createElement('script');
  let done = false;
  window[cbName] = function(data){
    if(done) return;
    done = true;
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
    callback(null, data);
  };
  script.onerror = function(){
    if(done) return;
    done = true;
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
    callback(new Error('load failed'));
  };
  const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
  script.src = url + '?' + qs + '&callback=' + cbName;
  document.body.appendChild(script);
  setTimeout(function(){
    if(!done){ done = true; delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); callback(new Error('timeout')); }
  }, 10000);
}

function callApi(url, params, callback){
  const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
  fetch(url + '?' + qs, { method: 'GET' })
    .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(data){ callback(null, data); })
    .catch(function(fetchErr){
      jsonp(url, params, function(jsonpErr, data){
        if(jsonpErr){ callback(new Error('通信失敗')); }
        else { callback(null, data); }
      });
    });
}

function copyToClipboardAndOpenTab(text, label){
  function showCopyToast(ok){
    const t = document.createElement('div');
    t.textContent = ok ? (label+'のURLをコピーしました。新しいタブに貼り付けてください') : 'コピーに失敗しました（手動でコピーしてください）';
    t.style.position = 'fixed';
    t.style.bottom = '70px';
    t.style.left = '50%';
    t.style.transform = 'translateX(-50%)';
    t.style.background = ok ? '#2e7d32' : '#c62828';
    t.style.color = '#fff';
    t.style.padding = '10px 18px';
    t.style.borderRadius = '10px';
    t.style.fontSize = '14px';
    t.style.fontWeight = 'bold';
    t.style.zIndex = 999999;
    t.style.maxWidth = '85vw';
    t.style.textAlign = 'center';
    t.style.boxShadow = '0 2px 10px rgba(0,0,0,0.4)';
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3500);
  }

  function openTab(){
    const newTab = window.open('about:blank', '_blank');
    if(!newTab){
      alert('新しいタブを開けませんでした。ブラウザのポップアップブロックを確認してください。URLはコピー済みです。');
    }
  }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      showCopyToast(true);
      openTab();
    }).catch(function(){
      showCopyToast(false);
      openTab();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    document.body.removeChild(ta);
    showCopyToast(ok);
    openTab();
  }
}

function buildDaiLinks(entry){
  if(entry.siteType === 'daidata' || entry.siteType === 'teramoba'){
    return {
      detail: entry.siteUrl || '',
      history: null,
      suii: null
    };
  }
  const pmc = entry.pmc, mdc = entry.mdc, dn = entry.daiban, urt = entry.urt || '2173';
  return {
    detail: entry.siteUrl || ('https://m.site777.jp/f/D4000.do?pmc='+pmc+'&mdc='+mdc+'&dtdd=0&dn='+dn),
    history: 'https://m.site777.jp/f/D3100.do?pmc='+pmc+'&dtdd=0&dn='+dn+'&mdc='+mdc,
    suii: 'https://m.site777.jp/f/D3000.do?pmc='+pmc+'&gc=2&dn='+dn+'&urt='+urt+'&mdc='+mdc+'&dsgk=0&dtdd=0'
  };
}

function buildGroupLinks(entry){
  if(entry.siteType === 'daidata' || entry.siteType === 'teramoba'){
    return {
      list: entry.listUrl || '',
      suiiList: entry.suiiListUrl || ''
    };
  }
  const pmc = entry.pmc, mdc = entry.mdc, urt = entry.urt || '2173';
  return {
    list: 'https://m.site777.jp/f/D3300.do?pmc='+pmc+'&mdc='+mdc+'&bn=1&soc=1&sw=1&pan=1&urt='+urt+'&dtdd=0',
    suiiList: 'https://m.site777.jp/f/D4300.do?pmc='+pmc+'&mdc='+mdc+'&bn=1&pan=1&urt='+urt+'&dsgk=0&dtdd=0'
  };
}

function isValidEntry(e){
  if(!e.daiban || e.daiban === '-') return false;
  if(e.siteType === 'daidata' || e.siteType === 'teramoba') return !!e.siteUrl;
  return !!(e.pmc && e.mdc);
}
let selectedHall = null; // null = 全て
let reorderMode = false;

function loadOrder(key){
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e){ return []; }
}
function saveOrder(key, arr){
  try { localStorage.setItem(key, JSON.stringify(arr)); } catch(e){}
}
function sortByOrder(items, orderArr, keyFn){
  const order = orderArr.slice();
  items.forEach(item => { const k = keyFn(item); if(order.indexOf(k) === -1) order.push(k); });
  return items.slice().sort((a,b) => order.indexOf(keyFn(a)) - order.indexOf(keyFn(b)));
}
function moveInOrder(orderKey, allKeys, itemKey, dir){
  let order = loadOrder(orderKey);
  allKeys.forEach(k => { if(order.indexOf(k) === -1) order.push(k); });
  const i = order.indexOf(itemKey);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= order.length) return;
  const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  saveOrder(orderKey, order);
}

function fetchList(){
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('cardList').style.display = 'none';
  document.getElementById('emptyMsg').style.display = 'none';
  callApi(API_URL, {action:'listDai'}, function(err, data){
    document.getElementById('loadingMsg').style.display = 'none';
    if(err){
      document.getElementById('emptyMsg').style.display = 'block';
      document.getElementById('emptyMsg').textContent = '読み込みに失敗しました: ' + err.message;
      return;
    }
    allEntries = Array.isArray(data) ? data : [];
    renderTabs();
    render();
  });
}

function renderTabs(){
  const valid = allEntries.filter(isValidEntry);
  let halls = [];
  valid.forEach(e => { if(e.hallName && halls.indexOf(e.hallName) === -1) halls.push(e.hallName); });
  halls = sortByOrder(halls, loadOrder('hallOrder'), h => h);

  const tabsEl = document.getElementById('hallTabs');
  tabsEl.innerHTML = '';
  if(halls.length === 0){
    tabsEl.style.display = 'none';
    return;
  }
  tabsEl.style.display = 'flex';
  if(selectedHall && halls.indexOf(selectedHall) === -1) selectedHall = null;

  const allWrap = document.createElement('div');
  allWrap.className = 'tab-wrap';
  const allBtn = document.createElement('button');
  allBtn.className = 'hall-btn';
  allBtn.textContent = 'すべて';
  if(!selectedHall) allBtn.classList.add('active');
  allBtn.addEventListener('click', () => { selectedHall = null; renderTabs(); render(); });
  allWrap.appendChild(allBtn);
  tabsEl.appendChild(allWrap);

  halls.forEach((h, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'tab-wrap';
    if(reorderMode){
      const left = document.createElement('button');
      left.className = 'move-btn';
      left.textContent = '◀';
      left.disabled = idx === 0;
      left.addEventListener('click', (e) => { e.stopPropagation(); moveInOrder('hallOrder', halls, h, -1); renderTabs(); });
      wrap.appendChild(left);
    }
    const btn = document.createElement('button');
    btn.className = 'hall-btn';
    btn.textContent = h;
    if(selectedHall === h) btn.classList.add('active');
    btn.addEventListener('click', () => { if(reorderMode) return; selectedHall = h; renderTabs(); render(); });
    wrap.appendChild(btn);
    if(reorderMode){
      const right = document.createElement('button');
      right.className = 'move-btn';
      right.textContent = '▶';
      right.disabled = idx === halls.length - 1;
      right.addEventListener('click', (e) => { e.stopPropagation(); moveInOrder('hallOrder', halls, h, 1); renderTabs(); });
      wrap.appendChild(right);
    }
    tabsEl.appendChild(wrap);
  });
}

function render(){
  const valid = allEntries.filter(e => isValidEntry(e) && (!selectedHall || e.hallName === selectedHall));
  const cardList = document.getElementById('cardList');
  const emptyMsg = document.getElementById('emptyMsg');
  cardList.innerHTML = '';

  if(valid.length === 0){
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = 'まだデータがありません。サイトセブンの出玉詳細ページでブックマークレットを実行してください。';
    cardList.style.display = 'none';
    return;
  }
  emptyMsg.style.display = 'none';
  cardList.style.display = 'flex';

  // hallName + modelName でグループ化
  const groups = {};
  let order = [];
  valid.forEach(entry => {
    const key = (entry.hallName||'') + '|' + (entry.modelName||'');
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(entry);
  });
  order = sortByOrder(order, loadOrder('groupOrder'), k => k);

  order.forEach((key, idx) => {
    const list = groups[key];
    list.sort((a,b) => (parseInt(a.daiban,10)||0) - (parseInt(b.daiban,10)||0));
    const first = list[0];
    const glinks = buildGroupLinks(first);

    const group = document.createElement('div');
    group.className = 'group';

    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML =
      '<span class="toggle">−</span>'+
      '<div style="flex:1;min-width:0;">'+
        '<div class="model">'+(first.modelName||'')+'</div>'+
        '<div class="hall">'+(first.hallName||'')+'</div>'+
      '</div>'+
      (reorderMode ? '<div class="group-move"><button class="mv-up" '+(idx===0?'disabled':'')+'>▲</button><button class="mv-down" '+(idx===order.length-1?'disabled':'')+'>▼</button></div>' : '')+
      '<button class="group-suii">推移一覧</button>'+
      '<button class="group-del" title="この機種をまとめて削除">✕</button>';
    group.appendChild(head);

    if(reorderMode){
      head.querySelector('.mv-up').addEventListener('click', (e) => { e.stopPropagation(); moveInOrder('groupOrder', order, key, -1); render(); });
      head.querySelector('.mv-down').addEventListener('click', (e) => { e.stopPropagation(); moveInOrder('groupOrder', order, key, 1); render(); });
    }

    const body = document.createElement('div');
    body.className = 'group-body';

    list.forEach(entry => {
      const dlinks = buildDaiLinks(entry);
      const row = document.createElement('div');
      row.className = 'dai-row';
      const historyBtn = dlinks.history
        ? '<button class="lnk-history" data-url="'+dlinks.history.replace(/"/g,'&quot;')+'" data-label="大当り履歴">履歴</button>'
        : '<button class="lnk-history" disabled style="opacity:0.35;">履歴</button>';
      const suiiBtn = dlinks.suii
        ? '<button class="lnk-suii" data-url="'+dlinks.suii.replace(/"/g,'&quot;')+'" data-label="出玉推移">出玉</button>'
        : '<button class="lnk-suii" disabled style="opacity:0.35;">出玉</button>';
      row.innerHTML =
        '<div class="dn">'+(entry.daibanDisplay||entry.daiban)+'</div>'+
        '<div class="links">'+
          '<button class="lnk-detail" data-url="'+(dlinks.detail||'').replace(/"/g,'&quot;')+'" data-label="出玉詳細"'+((entry.siteType==='daidata'||entry.siteType==='teramoba')?' data-direct="1"':'')+'>詳細</button>'+
          historyBtn+
          suiiBtn+
        '</div>'+
        '<button class="dai-del" title="この台を削除">✕</button>';
      row.querySelector('.dai-del').addEventListener('click', (e) => {
        e.stopPropagation();
        if(!confirm(entry.hallName+' '+(entry.daibanDisplay||entry.daiban)+'番台を削除します。よろしいですか？')) return;
        callApi(API_URL, {action:'deleteDaiOne', hallName:entry.hallName, daiban:entry.daiban}, function(err){
          if(err){ alert('削除に失敗しました: ' + err.message); return; }
          fetchList();
        });
      });
      body.appendChild(row);
    });
    group.appendChild(body);

    head.querySelector('.model').addEventListener('click', (e) => {
      e.stopPropagation();
      if(first.siteType === 'daidata' || first.siteType === 'teramoba'){ if(glinks.list) window.open(glinks.list, '_blank'); }
      else { copyToClipboardAndOpenTab(glinks.list, '台番一覧'); }
    });
    head.querySelector('.group-suii').addEventListener('click', (e) => {
      e.stopPropagation();
      if(first.siteType === 'daidata' || first.siteType === 'teramoba'){ if(glinks.suiiList) window.open(glinks.suiiList, '_blank'); }
      else { copyToClipboardAndOpenTab(glinks.suiiList, '出玉推移一覧'); }
    });
    head.querySelector('.group-del').addEventListener('click', (e) => {
      e.stopPropagation();
      if(!confirm((first.modelName||'')+'（'+(first.hallName||'')+'）を台番ごとまとめて削除します。よろしいですか？')) return;
      callApi(API_URL, {action:'deleteDaiGroup', hallName:first.hallName, modelName:first.modelName}, function(err){
        if(err){ alert('削除に失敗しました: ' + err.message); return; }
        fetchList();
      });
    });
    head.addEventListener('click', () => {
      body.classList.toggle('collapsed');
      head.querySelector('.toggle').textContent = body.classList.contains('collapsed') ? '+' : '−';
    });
    group.querySelectorAll('.dai-row .links button[data-url]').forEach(function(btn){
      btn.addEventListener('click', function(){
        const url = btn.getAttribute('data-url');
        const label = btn.getAttribute('data-label');
        if(btn.getAttribute('data-direct') === '1'){
          window.open(url, '_blank');
        } else {
          copyToClipboardAndOpenTab(url, label);
        }
      });
    });

    cardList.appendChild(group);
  });
}

document.getElementById('reorderBtn').addEventListener('click', () => {
  reorderMode = !reorderMode;
  document.getElementById('reorderBtn').textContent = reorderMode ? '並び替え完了' : '並び替え';
  document.getElementById('reorderBtn').style.background = reorderMode ? '#16a34a' : '#7c3aed';
  renderTabs();
  render();
});

document.getElementById('refreshBtn').addEventListener('click', fetchList);

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('登録されているショートカットをすべて削除します。よろしいですか？')){
    callApi(API_URL, {action:'resetDai'}, function(err){
      if(err){ alert('削除に失敗しました: ' + err.message); return; }
      fetchList();
    });
  }
});

fetchList();
</script>
</body>
</html>
